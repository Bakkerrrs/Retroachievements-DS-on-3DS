# RetroAchievements configuration for nds-bootstrap
#
# Copy to sd:/_nds/nds-bootstrap/ra.cfg and fill in the credentials.
#
# The shape is odelot's MiSTer core's, deliberately: keys you already know, and a file you can
# copy from a working example. Unknown keys are reported so a typo is visible; the keys marked
# "not yet" below are recognised and parsed and currently do nothing, because what they control
# does not exist in this fork yet. They are accepted rather than rejected so odelot's own file
# loads here unchanged.

# RetroAchievements credentials.
#
# The password stays in this file and is sent to the server in the clear on every boot --
# dorequest.php answers over plain HTTP, which is what makes any of this possible on a console
# with no TLS. That is a known cost, chosen over caching a token instead.
username=
password=

# Hardcore mode. (1=yes, 0=no)
#
# What the loader does with 1 is settled and enforced: the in-game menu refuses to edit memory for
# the whole session, the cheat engine running takes hardcore away and the menu says so, and every
# unlock records the mode it was earned in so a later boot cannot upgrade it. The `Achievements...`
# menu shows which mode you are in, on the line above its own name. nds-bootstrap has no savestates,
# no rewind and no slowdown -- there is nothing there to switch off.
#
# What is not settled is whether RetroAchievements will accept it. The server does not recognise this
# client's User-Agent and injects a "Warning: Unknown Emulator" notice whose own wording says
# hardcore unlocks cannot be earned. Getting that changed is a conversation in progress -- see
# docs/ra-registration-request.md.
#
# Until it is, setting this to 1 gains you nothing against the server, and that is measured rather
# than assumed. Sent h=1 on a real account, the server answers Success and files the unlock as
# **softcore**: the hardcore score does not move, the softcore one does, and the achievement comes
# back in the softcore list on the next boot. The notice is telling the truth and it enforces it by
# quiet downgrade, not by refusing.
#
# So 1 is not dangerous here, and it is not useful either. It costs exactly what softcore costs --
# an achievement is spent the moment it lands, because the server returns it from then on and it is
# left out of the set. That has always been true of this client and is not about hardcore. If you
# want a set kept whole for a hardcore run once the client is recognised, the setting you want is
# submit=0 below, not this one.
#
# What 1 does buy you today is the half that works locally: the in-game menu's RAM editor stays shut
# for the session, the cheat engine takes hardcore away and the menu says so, and every unlock
# records the mode it was earned in so a later boot cannot upgrade it.
hardcore=0

# Extra logging. (1=yes, 0=no)
debug=0

# What the *screen* shows while the loader talks to RetroAchievements. (1=everything, 0=a summary)
#
# 0 is the default and what you want to play: a progress bar, the step being worked on in ordinary
# words -- signing in, looking up this game, downloading achievements -- and four or five lines of
# result underneath. Roughly a screenful instead of several hundred lines of chip bring-up.
#
# 1 is the diagnostic mode. It puts the whole ladder on the screen as it happens: stage headings,
# the SCFG registers, every line the WiFi stack narrates on its way up, heap reports between rungs
# and a twenty-line summary at the end.
#
# **The log file gets everything either way.** This setting does not touch it. If a boot goes wrong,
# ra_wifi_launcher.log has the full story whichever value is set here, which is why the quiet mode
# is safe to leave on -- there is nothing to turn back on before a problem can be looked at.
verbose_log=0

# The on-screen notification when an achievement unlocks. (1=yes, 0=no)
#
# This is the only part of the loader that has to *negotiate with the running game for its hardware*.
# To draw a popup it has to find object VRAM and an OAM entry the game appears not to be using -- and
# "appears not to be using" is an inference, not a fact. Getting it wrong has broken a game's graphics
# and hung one, and each fix has been a better inference rather than an answer.
#
# Everything else about an achievement reads memory or writes to a window nobody else owns, which is
# why this is the one switch worth having. With overlay=0 an unlock is still detected, still queued,
# still submitted, and still listed in the in-game menu with the date it was earned. Only the popup
# goes -- and the popup is the only part that can touch the game.
#
# Defaults to 1, because on every game measured so far it works and is worth having. Turn it off for a
# game where it does not.
overlay=1

# Write unlocks to sd:/ra_unlocks.txt. (1=yes, 0=no)
#
# A diagnostic before it is a feature. It exists because a game froze at the exact moment an
# achievement fired, with the popup already off -- so what was left at that instant was the id
# crossing to the ARM7 and the ARM7 writing a record to the SD card while the game runs. The card is
# the ARM7's, and it is also what the game is streaming from; that contention has already been caught
# corrupting this very file.
#
# It answered that much: queue=0 does not freeze, so the cause is somewhere in the handoff. The first
# guess after that -- a card read suspended mid-command, which IME off does not protect -- was wrong.
# Gating on it changed nothing, and the record the frozen session wrote came back COMPLETE and
# CORRECT, which says the append ran to the end. So the freeze is a side effect of the work, not a
# hang inside it, and there are three candidates left. Hence a ladder rather than a switch:
#
#   0  nothing crosses to the ARM7 at all              (unlock lost at power off)
#   3  the request crosses and is acknowledged, and    (unlock lost at power off)
#      the ARM7 does nothing else
#   2  RETIRED -- behaves as 1, see below
#   1  everything                                      (shipping behaviour)
#
# The ladder did its job in three boots. 3 cleared the stage, so the handoff is innocent. 2 cleared it
# too, and 2 differed from 1 in exactly one thing: it skipped reading the RTC. One variable, one
# answer -- reading the console's clock on the frame an achievement fires is what froze the game.
#
# The fix took the RTC out of the game's way rather than making it cheaper: it is read once, at init,
# before the game has a main loop to interrupt. So there is nothing left for level 2 to skip and it
# now behaves as 1. Level 3 stays, because "the ARM7 does nothing at all" is still the useful thing to
# be able to switch to if something new ever fires on the frame an unlock lands.
#
# Level 3 is ignored on DSi-enhanced (TWL-SDK) titles, which get level 1 whatever is set here: the
# ARM7 binary those load has forty-four spare bytes and the test costs more than that.
queue=1

# --- this fork's own, not odelot's --------------------------------------------------------

# Run the network ladder at all. (1=yes, 0=no)
#
# sync=0 skips it and plays from the per-game cache instead. Worth having for a measured reason
# rather than a preference: a boot with no access point in range spends about forty seconds failing
# to associate before the game starts, and a boot with one spends about fifteen redoing yesterday's
# work. Neither is a cost worth paying just to play.
#
# Nothing about detecting achievements needs the radio -- the cardengine never had it. With the
# ladder skipped the set comes from the cache, unlocks are still detected, still shown on screen and
# still queued to the card, and one later boot with sync=1 drains the queue and refreshes the set.
# Syncing and playing become separate activities, which is what they always were.
sync=1

# Send what the queue holds. (1=yes, 0=no)
#
# submit=0 reads the queue and reports it in the log, then neither sends nor clears it. This is for
# testing rather than for players: an achievement is spent the moment it lands, because the server
# returns it in r=unlocks from then on and the scanner leaves it out of the staged block -- so the
# cheapest repeatable test case on the card disappears the first time it works.
submit=1

# --- recognised, not yet acted on -------------------------------------------------------
# All of these describe the on-screen overlay, which has no font yet -- see the "known
# graphical limitations" section of docs/retroachievements.md. Parsed and ignored for now.
show_challenge_show_popup=1
show_challenge_hide_popup=0
show_progress_popups=1
show_progress_name=1
show_leaderboards_updates=1
show_leaderboards_submission=1
force_hardcore=0
multiline_desc=0
list_desc_ticker=0
list_hotkey=0
