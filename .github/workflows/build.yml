name: Build nds-bootstrap-ra

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    # Unpinned, deliberately, and it is the lesser of two evils.
    #
    # This was pinned to devkitpro/devkitarm:20241104 and had never once gone green in this repo:
    # four runs, four failures, all of them `apt-get install` dying on a 404 for linux-libc-dev.
    # Nothing to do with the code -- that image is bullseye, Debian 11 has moved to LTS, and the
    # security pool it points at no longer serves the package version its index names. A pin that
    # cannot install its own dependencies is not reproducibility, it is rot.
    #
    # So the image floats and the toolchain version is *printed* instead, which is this project's
    # usual trade: do not try to prevent the unknown, make it visible in the log. Releases are not
    # built here anyway -- tools/ra_release.sh builds those -- so a drift shows up as a margin
    # changing in the report below rather than as a ROM nobody can reproduce.
    container: devkitpro/devkitarm:latest
    name: Build with Docker using devkitARM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: |
          # Retried, because the mirror being briefly out of step with its own index is exactly how
          # this workflow spent its whole life failing. gcc is for lzss, which has to run on the
          # host; p7zip-full is for packing the artifacts.
          for i in 1 2 3; do
            apt-get update && apt-get install -y --no-install-recommends p7zip-full gcc && break
            echo "apt attempt $i failed; retrying"
            sleep 10
          done
          gcc lzss.c -o /usr/local/bin/lzss
      - name: Which toolchain this ran on
        run: arm-none-eabi-gcc --version | head -1
      - name: Setup environment
        run: git config --global safe.directory '*'
      # The reader's chain walker is pure address logic, so it can be checked here
      # rather than by flashing a card. Runs before the build so a logic regression
      # fails in seconds instead of after every cardengine variant has linked.
      - name: Test the RA reader
        run: ./tools/ra_reader_test.sh
      - name: Build nightly
        if: ${{ !startsWith(github.ref, 'refs/tags') }}
        run: make package-nightly
      - name: Build release
        if: ${{ startsWith(github.ref, 'refs/tags') }}
        run: make package-release
      # How much room is left in each cardengine window that carries the reader.
      # The linker scripts already fail the build if it runs out; this is so the
      # margin is visible while it is still a margin, on the pinned toolchain rather
      # than whatever a developer happens to have installed.
      - name: Report cardengine space budget
        run: ./tools/ra_snapshot_addr.sh
      - name: Pack 7z nightly
        if: ${{ !startsWith(github.ref, 'refs/tags') }}
        run: |
          printf "${{ github.sha }}\n" >> bin/nightly-bootstrap.ver
          mv bin/ nds-bootstrap/
          7z a nds-bootstrap.7z nds-bootstrap/

          mkdir -p ~/artifacts
          cp nds-bootstrap.7z ~/artifacts
      - name: Pack 7z release
        if: ${{ startsWith(github.ref, 'refs/tags') }}
        run: |
          printf "Release ${{ github.ref_name }}\n" >> bin/release-bootstrap.ver
          cd bin
          mkdir -p ~/artifacts

          7z a nds-bootstrap.7z .
          cp nds-bootstrap.7z ~/artifacts
          rm nds-bootstrap.7z

          7z a nds-bootstrap.zip .
          cp nds-bootstrap.zip ~/artifacts
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: ~/artifacts/*
          name: build

  # Only run this for non-PR jobs.
  publish_build:
    runs-on: ubuntu-latest
    name: Publish build
    if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Upload to ${{ github.repository }} release
        run: |
          ID=$(jq --raw-output '.release.id' $GITHUB_EVENT_PATH)

          for file in ${{ github.workspace }}/build/*; do
            AUTH_HEADER="Authorization: token ${{ secrets.GITHUB_TOKEN }}"
            CONTENT_LENGTH="Content-Length: $(stat -c%s $file)"
            CONTENT_TYPE="Content-Type: application/7z-x-compressed"
            UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/$ID/assets?name=$(basename $file)"

            curl -XPOST -H "$AUTH_HEADER" -H "$CONTENT_LENGTH" -H "$CONTENT_TYPE" --upload-file "$file" "$UPLOAD_URL"
          done
